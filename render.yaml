services:
  - type: web
    name: loanbazaar
    env: node
    plan: free
    autoDeploy: true
    healthCheckPath: /api/settings
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    disk:
      name: loanbazaar-documents
      mountPath: /var/lib/loanbazaar
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Render free has 512 MB. Node's default heap limit there is about 252 MB and the server ran out of it
      # while reading documents. This leaves room for the heap plus OCR and rendering outside it.
      - key: NODE_OPTIONS
        value: --max-old-space-size=360
      - key: DOCUMENT_AI_CONCURRENCY
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_ALLOW_DATA_COLLECTION
        value: "false"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: DOCUMENT_AI_ACCESS_CODE
        sync: false
      - key: DOCUMENT_AI_ADMIN_CODE
        sync: false
      - key: DOCUMENT_AI_SESSION_SECRET
        generateValue: true
      - key: DOCUMENT_AI_DATA_DIR
        value: /var/lib/loanbazaar/document-ai
      - key: DOCUMENT_AI_ENABLED
        sync: false
      - key: DOCUMENT_AI_GEMINI_MODEL
        sync: false
